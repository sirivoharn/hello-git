<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Hello World Experience</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-20px) rotate(3deg)' },
            },
            floatFast: {
              '0%, 100%': { transform: 'translateY(0px) translateX(0px)' },
              '50%': { transform: 'translateY(-30px) translateX(15px)' },
            },
            gradientBG: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.1)' },
            },
            shimmerText: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          },
          animation: {
            'float-slow': 'floatSlow 6s ease-in-out infinite',
            'float-fast': 'floatFast 4s ease-in-out infinite',
            'gradient-bg': 'gradientBG 15s ease infinite',
            'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
            'shimmer': 'shimmerText 4s linear infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center overflow-hidden relative font-sans selection:bg-cyan-500 selection:text-black">

  <!-- Dynamic Animated Background Gradients & Orbs -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#030712] to-black -z-20"></div>
  
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-cyan-500/20 rounded-full blur-[120px] animate-pulse-glow pointer-events-none"></div>
  <div class="absolute top-1/2 -right-32 w-[30rem] h-[30rem] bg-indigo-500/20 rounded-full blur-[140px] animate-pulse-glow pointer-events-none" style="animation-delay: 2s;"></div>
  <div class="absolute -bottom-32 left-1/3 w-[25rem] h-[25rem] bg-fuchsia-500/15 rounded-full blur-[130px] animate-pulse-glow pointer-events-none" style="animation-delay: 4s;"></div>

  <!-- Floating Ambient Particles -->
  <div class="absolute top-1/4 left-1/5 w-3 h-3 bg-cyan-400 rounded-full blur-[1px] animate-float-slow pointer-events-none opacity-70"></div>
  <div class="absolute top-2/3 right-1/4 w-4 h-4 bg-indigo-400 rounded-full blur-[1px] animate-float-fast pointer-events-none opacity-60" style="animation-delay: 1s;"></div>
  <div class="absolute top-1/3 right-1/5 w-2 h-2 bg-fuchsia-400 rounded-full blur-[1px] animate-float-slow pointer-events-none opacity-80" style="animation-delay: 2.5s;"></div>

  <!-- Main Glassmorphism Card Container -->
  <main class="relative z-10 max-w-2xl w-full mx-4 p-8 sm:p-12 rounded-3xl bg-slate-900/40 border border-slate-800/80 backdrop-blur-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] text-center group transition-all duration-700 hover:border-cyan-500/50 hover:shadow-[0_0_80px_rgba(6,182,212,0.15)]">

    <!-- Glowing Top Badge -->
    <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-slate-800/60 border border-slate-700/60 text-cyan-400 text-xs sm:text-sm mb-8 backdrop-blur-md shadow-lg animate-float-slow">
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-cyan-500"></span>
      </span>
      <span class="tracking-wider uppercase font-semibold">Next-Gen Web Experience</span>
    </div>

    <!-- Spectacular Shimmering Hello World Title -->
    <h1 class="text-6xl sm:text-8xl font-black tracking-tight mb-6 bg-gradient-to-r from-cyan-400 via-indigo-300 to-fuchsia-500 bg-[length:200%_auto] bg-clip-text text-transparent animate-shimmer filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
      Hello, World!
    </h1>

    <!-- Subtitle with Smooth Fade -->
    <p class="text-slate-400 text-base sm:text-lg max-w-lg mx-auto mb-10 font-light leading-relaxed">
      ยกระดับหน้าเว็บธรรมดาให้มีชีวิตชีวา ด้วย Tailwind CSS Custom Keyframes และ Glassmorphism Design
    </p>

    <!-- Action Buttons with Modern Glow & Hover Physics -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="#explore" class="relative group/btn overflow-hidden px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-medium shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_0_30px_rgba(6,182,212,0.7)] active:translate-y-0">
        <span class="absolute inset-0 w-full h-full bg-white/20 transform -skew-x-12 -translate-x-full group-hover/btn:translate-x-full transition-transform duration-1000"></span>
        <span class="relative flex items-center gap-2">
          เริ่มต้นใช้งาน
          <svg class="w-4 h-4 transition-transform duration-300 group-hover/btn:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </span>
      </a>

      <button class="px-8 py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 text-slate-300 font-medium backdrop-blur-md transition-all duration-300 transform hover:-translate-y-1 hover:border-slate-600">
        เรียนรู้เพิ่มเติม
      </button>
    </div>

    <!-- Decorative Corner Accents -->
    <div class="absolute top-0 left-0 w-24 h-24 bg-gradient-to-br from-cyan-500/20 to-transparent rounded-tl-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-24 h-24 bg-gradient-to-tl from-fuchsia-500/20 to-transparent rounded-br-3xl pointer-events-none"></div>
  </main>

  <!-- Footer Branding -->
  <footer class="absolute bottom-6 text-slate-500 text-xs tracking-widest uppercase flex items-center gap-2">
    <span>Crafted with Tailwind CSS</span>
    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
    <span>HTML5</span>
  </footer>

</body>
</html>
