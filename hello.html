<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Animation</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-15px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 15px rgba(59, 130, 246, 0.5))' },
              '50%': { opacity: '0.6', filter: 'drop-shadow(0 0 35px rgba(147, 51, 234, 0.8))' },
            }
          },
          animation: {
            float: 'float 4s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center overflow-hidden relative selection:bg-blue-500 selection:text-white">

  <!-- Background Glowing Blobs for Visual Depth -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl animate-pulse pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse pointer-events-none" style="animation-delay: 1.5s;"></div>

  <!-- Main Container -->
  <main class="relative z-10 text-center px-4">
    <!-- Floating Icon / Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-900/80 border border-slate-800 text-slate-400 text-sm mb-8 backdrop-blur-md shadow-lg animate-float">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      Tailwind CSS v3 + Animations
    </div>

    <!-- Animated Hello World Title -->
    <h1 class="text-6xl sm:text-8xl font-black tracking-tight mb-6 bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent animate-pulse-glow">
      Hello, World!
    </h1>

    <!-- Subtitle -->
    <p class="text-slate-400 text-lg sm:text-xl max-w-md mx-auto mb-10 font-light">
      สร้างสรรค์หน้าเว็บสุดล้ำด้วย Tailwind CSS และ Custom Keyframe Animations อย่างง่ายดาย
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <button class="px-8 py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium shadow-lg shadow-blue-600/30 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0">
        Get Started
      </button>
      <button class="px-8 py-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium backdrop-blur-md transition-all duration-300 transform hover:-translate-y-0.5">
        Learn More
      </button>
    </div>
  </main>

  <!-- Footer Credit -->
  <footer class="absolute bottom-6 text-slate-600 text-xs tracking-wider uppercase">
    Designed with Tailwind CSS & HTML5
  </footer>

</body>
</html>
